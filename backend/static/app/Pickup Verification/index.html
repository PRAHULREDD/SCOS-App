    body {
      min-height: max(884px, 100dvh);
    }

    <script src="https://cdn.jsdelivr.net/npm/@capacitor/core/dist/capacitor.js"></script>

    <style>body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }</style>

<body class="bg-surface font-body-md text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md font-['Inter'] font-semibold text-lg docked full-width top-0 sticky z-50 border-b border-slate-100 dark:border-slate-800 shadow-sm">
<div class="flex justify-between items-center px-4 py-3 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<button type="button" onclick="window.location.href='../Assigned Pickups/index.html'" class="p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Back to tasks">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">arrow_back</span>
</button>
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl" data-icon="recycling">recycling</span>
</div>
<span class="text-xl font-bold tracking-tight text-emerald-800 dark:text-emerald-300">SCOS</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors active:opacity-70">
<span class="material-symbols-outlined text-slate-500" data-icon="notifications">notifications</span>
</button>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close-up portrait of a professional municipal worker in a reflective safety vest, warm natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcjoQd575aQDV93CuDHGtYwN4asoyVzP2KmXnQDxPynvWCyA20dZGo0JFIthK0oN9F5Kr737iZobb97zA3YA9jkHxJVeUwr28bc-Gm8oC7v7sdTVlTetqEe9o_KpnKsi1WQYMWUmr9refpsgJw9prWi04qsaDOMwKQbM0btyuMDVzX0MUkHq_ICNVHVp-FNqbGnZ1lRzYeTne1NnWg5l496N-v8ho7cjk1_UNw5tw_0w_AiEH2-UinUfD8LOde8CznvC8G8tMGuzJS"/>
</div>
</div>
</div>
</header>
<form id="pickup-verification-form" class="max-w-xl mx-auto px-margin-mobile py-lg space-y-lg">
<input type="file" id="proof-image" accept="image/*" class="hidden">
<input type="hidden" id="complaint-id" value="1">
<!-- Task Header Card -->
<section class="bg-surface-container-low rounded-xl p-md shadow-sm border border-outline-variant/30">
<div class="flex justify-between items-start mb-sm">
<div>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Pickup Verification</span>
<h1 id="pickup-bin-title" class="font-headline-md text-headline-md text-on-surface">Assigned Task</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="task_alt">task_alt</span>
                        Municipal Collection Point
                    </p>
</div>
<div class="bg-primary-container/20 text-primary px-3 py-1 rounded-full font-label-lg text-label-lg flex items-center gap-1">
<span class="material-symbols-outlined text-sm fill-icon" data-icon="verified">verified</span>
                    Active Task
                </div>
</div>
</section>
<!-- Image Upload Section -->
<section class="space-y-sm">
<h2 class="font-title-md text-title-md px-1">Proof Photo</h2>
<button type="button" class="w-full aspect-video bg-secondary-container/30 border-2 border-dashed border-primary/30 rounded-2xl flex flex-col items-center justify-center gap-md hover:bg-secondary-container/50 transition-all active:scale-[0.98]">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<div class="text-center">
<p class="font-title-md text-title-md text-primary">Tap to Capture Photo</p>
<p class="font-label-lg text-label-lg text-on-surface-variant">Attach photo for verification (optional)</p>
</div>
</button>
<script>
    document.querySelector('button.aspect-video').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('proof-image').click();
    });
    document.getElementById('proof-image').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            document.querySelector('button.aspect-video p.text-primary').innerText = file.name;
            document.querySelector('button.aspect-video p.text-on-surface-variant').innerText = "Tap again to change";
        }
    });
</script>
</section>

<!-- Confirm Action -->
<div class="pt-lg">
<button type="submit" class="w-full h-14 bg-primary text-on-primary rounded-full font-title-lg text-title-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined fill-icon" data-icon="check_circle">check_circle</span>
                Confirm Pickup
            </button>
</div>
</form>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 py-3 pb-safe bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(46,49,51,0.08)] z-50 rounded-t-2xl">
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-6 py-1.5 hover:text-emerald-600 dark:hover:text-emerald-300 scale-95 active:scale-90 transition-transform duration-200" href="../Driver Dashboard/index.html">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Inter'] text-[12px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-emerald-100 dark:bg-emerald-900/40 text-emerald-900 dark:text-emerald-100 rounded-2xl px-6 py-1.5 scale-95 active:scale-90 transition-transform duration-200" href="../Assigned Pickups/index.html">
<span class="material-symbols-outlined fill-icon" data-icon="assignment">assignment</span>
<span class="font-['Inter'] text-[12px] font-medium">Assigned Tasks</span>
</a>
</nav>
<script src="../../js/toast.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/driver.js"></script>
</body></html>
